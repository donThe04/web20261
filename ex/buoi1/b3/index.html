<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo tài khoản</title>
</head>

<body>

    <h1>Tạo tài khoản</h1>

    <form action="/submit" method="POST" name="registerForm">

        Name:
        <input type="text" name="firstName" placeholder="First name" required>
        <input type="text" name="lastName" placeholder="Last name" required>

        <br><br>

        Date of birth:
        <input type="number" name="dobDay" placeholder="Day" min="1" max="31" required>
        <input type="number" name="dobMonth" placeholder="Month" min="1" max="12" required>
        <input type="number" name="dobYear" placeholder="Year" min="1900" max="2025" required>

        <br><br>

        Gender:
        <select name="gender" required>
            <option value="" disabled selected>Select gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>

        <br><br>

        Mobile number or email address:
        <input type="text" name="contact" placeholder="Phone or email" required>
        <br><br>

        Mật khẩu:
        <input type="password" name="password" minlength="4" required>
        <br><br>

        Xác nhận:
        <input type="password" name="confirmPassword" minlength="4" required>

        <br><br>
        <input type="checkbox" name="showPassword" id="showPassword">
        <label for="showPassword">Hiện mật khẩu</label>

        <br><br>
        <button type="submit">Tạo tài khoản</button>

    </form>

</body>

</html>
