<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Basic</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 400px;
        }

        .modal-content h4 {
            text-align: center;
            margin-top: 0;
        }

        .modal-content input {
            width: 100%;
            padding: 8px;
            margin: 5px 0 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .modal-content label {
            display: block;
            margin-top: 5px;
        }

        .modal-content button {
            margin-top: 10px;
            margin-right: 5px;
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>


<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [kw, setKeyword] = React.useState("");
            const [newUser, setNewUser] = React.useState(null);
            return (
                <div>
                    <h1>Quản lý người dùng</h1>
                    <SearchForm onChangeValue={setKeyword} />
                    <AddUser onAdd={setNewUser} />
                    <ResultTable keyword={kw} user={newUser}
                        onAdded={() => setNewUser(null)} />
                </div>
            );
        }

        function SearchForm({ onChangeValue }) {
            return (
                <input
                    type="text"
                    placeholder="Tìm theo name, username"
                    onChange={(e) => onChangeValue(e.target.value)}
                />
            );
        }


        function ResultTable({ keyword, user, onAdded }) {
            const [users, setUsers] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [editing, setEditing] = React.useState(null);
            React.useEffect(() => {
                if (user) {
                    setUsers((prev) => [...prev, { ...user, id: prev.length + 1 }]);
                    onAdded();
                }
            }, [user]);

            React.useEffect(() => {
                fetch("https://jsonplaceholder.typicode.com/users")
                    .then((res) => res.json())
                    .then((data) => {
                        setUsers(data);
                        setLoading(false);
                    })
                    .catch((error) => {
                        console.error("Lỗi tải dữ liệu:", error);
                        setLoading(false);
                    });
            }, []);

            const filteredUsers = users.filter(
                (u) =>
                    u.name.toLowerCase().includes(keyword.toLowerCase()) ||
                    u.username.toLowerCase().includes(keyword.toLowerCase())
            );
            function editUser(user) {
                setEditing({ ...user, address: { ...user.address } });
            }
            function handleEditChange(field, value) {
                if (["street", "suite", "city"].includes(field)) {
                    setEditing(prev => ({
                        ...prev,
                        address: {
                            ...prev.address,
                            [field]: value
                        }
                    }));
                } else {
                    setEditing(prev => ({
                        ...prev,
                        [field]: value
                    }));
                }
            }

            function saveUser() {
                setUsers(prev => prev.map(u => u.id === editing.id ? editing : u));
                setEditing(null);
            }
            function removeUser(id) {
                setUsers((prev) => prev.filter((u) => u.id !== id));
            }

            <button className="btn-delete" onClick={() => removeUser(user.id)}>
                Xóa
            </button>


            return (
                <div>
                    {editing && (
                        <div className="modal-overlay">
                            <div className="modal-content">

                                <h4>Sửa người dùng</h4>

                                <label htmlFor="edit-name">Name: </label>
                                <input
                                    id="edit-name"
                                    type="text"
                                    value={editing.name}
                                    onChange={(e) =>
                                        handleEditChange("name", e.target.value)
                                    }
                                />

                                <label htmlFor="edit-username">Username: </label>
                                <input
                                    id="edit-username"
                                    type="text"
                                    value={editing.username}
                                    onChange={(e) =>
                                        handleEditChange("username", e.target.value)
                                    }
                                />

                                <label htmlFor="edit-email">Email: </label>
                                <input
                                    id="edit-email"
                                    type="email"
                                    value={editing.email}
                                    onChange={(e) =>
                                        handleEditChange("email", e.target.value)
                                    }
                                />

                                <label htmlFor="edit-street">Street: </label>
                                <input
                                    id="edit-street"
                                    type="text"
                                    value={editing.address.street}
                                    onChange={(e) =>
                                        handleEditChange("street", e.target.value)
                                    }
                                />

                                <label htmlFor="edit-suite">Suite: </label>
                                <input
                                    id="edit-suite"
                                    type="text"
                                    value={editing.address.suite}
                                    onChange={(e) =>
                                        handleEditChange("suite", e.target.value)
                                    }
                                />

                                <label htmlFor="edit-city">City: </label>
                                <input
                                    id="edit-city"
                                    type="text"
                                    value={editing.address.city}
                                    onChange={(e) =>
                                        handleEditChange("city", e.target.value)
                                    }
                                />

                                <label htmlFor="edit-phone">Phone: </label>
                                <input
                                    id="edit-phone"
                                    type="text"
                                    value={editing.phone}
                                    onChange={(e) =>
                                        handleEditChange("phone", e.target.value)
                                    }
                                />

                                <label htmlFor="edit-website">Website: </label>
                                <input
                                    id="edit-website"
                                    type="text"
                                    value={editing.website}
                                    onChange={(e) =>
                                        handleEditChange("website", e.target.value)
                                    }
                                />

                                <button onClick={saveUser}>Lưu</button>
                                <button onClick={() => setEditing(null)}>
                                    Hủy
                                </button>

                            </div>
                        </div>
                    )}
                    <table border="1" cellPadding="8">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Address</th>
                                <th>Phone</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>

                        <tbody>
                            {filteredUsers.map((u) => (
                                <tr key={u.id}>
                                    <td>{u.id}</td>
                                    <td>{u.name}</td>
                                    <td>{u.username}</td>
                                    <td>{u.email}</td>

                                    <td>
                                        {u.address.street}, {u.address.suite},{" "}
                                        {u.address.city}
                                    </td>

                                    <td>{u.phone}</td>

                                    <td>
                                        <button onClick={() => editUser(u)}>
                                            Sửa
                                        </button>

                                        <button onClick={() => removeUser(u.id)}>
                                            Xóa
                                        </button>
                                    </td>
                                </tr>
                            ))}

                            {filteredUsers.length === 0 && (
                                <tr>
                                    <td colSpan="7">
                                        Không tìm thấy người dùng!
                                    </td>
                                </tr>
                            )}
                        </tbody>
                    </table>
                </div>
            );


        }
        function AddUser({ onAdd }) {
            const [adding, setAdding] = React.useState(false);
            const [user, setUser] = React.useState({
                name: "", username: "", email: "",
                address: { street: "", suite: "", city: "" },
                phone: "", website: ""
            });
            const handleChange = (e) => {
                const { id, value } = e.target;
                if (["street", "suite", "city"].includes(id)) {
                    setUser({ ...user, address: { ...user.address, [id]: value } });
                } else {
                    setUser({ ...user, [id]: value });
                }
            };
            const handleAdd = () => {
                if (user.name === "" || user.username === "") {
                    alert("Vui lòng nhập Name và Username!");
                    return;
                }
                onAdd(user);
                setUser({
                    name: "", username: "", email: "", address: {
                        street: "",
                        suite: "", city: ""
                    }, phone: "", website: ""
                });
                setAdding(false);
            };

            function editUser(user) {
                setEditing({ ...user, address: { ...user.address } });

            }

            return (
                < div >
                    <button onClick={() => setAdding(true)}>Thêm</button>
                    {
                        adding && (
                            <div className="modal-overlay">
                                <div className="modal-content">
                                    <h4>Thêm người dùng</h4>
                                    <label htmlFor="name"> Name: </label>
                                    <input id="name"
                                        type="text" value={user.name}
                                        onChange={handleChange} />
                                    <label htmlFor="usernmae"> Username: </label>
                                    <input id="username"
                                        type="text" value={user.username}
                                        onChange={handleChange} />
                                    <label htmlFor="email"> Email: </label>
                                    <input id="email"
                                        type="email" value={user.email}
                                        onChange={handleChange} />
                                    <label htmlFor="street">Street: </label>
                                    <input
                                        id="street"
                                        type="text"
                                        value={user.address.street}
                                        onChange={handleChange}
                                    />
                                    <label htmlFor="suite">Suite: </label>
                                    <input
                                        id="suite"
                                        type="text"
                                        value={user.address.suite}
                                        onChange={handleChange}
                                    />
                                    <label htmlFor="city">City: </label>
                                    <input
                                        id="city"
                                        type="text"
                                        value={user.address.city}
                                        onChange={handleChange}
                                    />
                                    <label htmlFor="phone"> Phone: </label>
                                    <input id="phone"
                                        type="number" value={user.phone}
                                        onChange={handleChange} />
                                    <label htmlFor="website"> Website: </label>
                                    <input id="website"
                                        type="text" value={user.website}
                                        onChange={handleChange} />

                                    <button onClick={handleAdd}>Thêm</button>
                                    <button onClick={() => setAdding(false)}>Hủy</button>
                                </div>
                            </div>
                        )
                    }
                </div>
            )
        }

        const root = ReactDOM.createRoot(
            document.getElementById("root")
        );

        root.render(<App />);
    </script>
</body>

</html>
